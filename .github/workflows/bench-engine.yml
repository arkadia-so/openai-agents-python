name: Bench engine
# ARK-81 bench, engine variant: bench-tests.yml (outrun as is) with each job a command unit of outrun.json:
# it looks itself up first and replays a pass recorded for the same inputs, toolchain and machine.
# Base: upstream tests.yml, runs-on swapped to outrun-linux-arm64 (ARM64) and outrun-macos.
# Kept: lint, typecheck, tests (3.10-3.14), native-macos-sandbox (8 jobs). Dropped: Windows jobs
# (tests-windows, packaged-contract-windows) and, to stay near 8 jobs, mypy-win32, containers,
# mcp-v1-compat, prospective-release-contract, packaged-contract-310/314, build-docs.
# Lives beside an untouched tests.yml because two repository tests read tests.yml (job names, conditions).

on:
  workflow_dispatch:
    inputs:
      cache:
        description: outrun cache namespace
        required: false
        default: outrun

permissions:
  contents: read
  id-token: write # outrun's cache (ARK-81)

env:
  UV_FROZEN: "1"
  OUTRUN_CACHE_URL: https://turbo-cache.arkadia.so
  OUTRUN_CACHE_TEAM: ${{ inputs.cache || 'outrun' }}
  # ARK-81 bench: outrun's image has a system Python 3.12 without headers (GitHub's has python3-dev); evdev builds
  # from source on aarch64, so use uv's managed Pythons, which ship their headers.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    runs-on: outrun-linux-arm64
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun (outrun)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Look lint up
        id: look
        run: .github/outrun/run lookup lint
      - name: Detect code changes
        id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # setup-uv v9.0.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: make sync
      - name: Verify formatting
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: make format-check
      - name: Run lint
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: make lint
      - name: Skip lint
        if: steps.changes.outputs.run != 'true' || steps.look.outputs.run != 'true'
        run: echo "Skipping lint for non-code changes."
      - name: Record lint
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: .github/outrun/run record lint --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  typecheck:
    runs-on: outrun-linux-arm64
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun (outrun)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Look typecheck up
        id: look
        run: .github/outrun/run lookup typecheck
      - name: Detect code changes
        id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # setup-uv v9.0.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      # ARK-81 bench: pyright needs Node on PATH; GitHub's image has it, outrun's Linux image does not.
      - name: 'outrun: setup Node for pyright'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore mypy cache
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'Makefile') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'Makefile') }}-
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: make sync
      - name: Run typecheck
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: make typecheck
      - name: Skip typecheck
        if: steps.changes.outputs.run != 'true' || steps.look.outputs.run != 'true'
        run: echo "Skipping typecheck for non-code changes."
      - name: Record typecheck
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: .github/outrun/run record typecheck --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  tests:
    runs-on: outrun-linux-arm64
    # Python 3.14 also runs coverage and installs Chromium with system dependencies.
    timeout-minutes: ${{ matrix.python-version == '3.14' && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      OPENAI_API_KEY: fake-for-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun (outrun)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Look tests up
        id: look
        run: .github/outrun/run lookup tests-${{ matrix.python-version }}
      - name: Detect code changes
        id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # setup-uv v9.0.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: make sync
      - name: Run tests with coverage
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true' && matrix.python-version == '3.14'
        run: make coverage
      - name: Test realtime demo in Chromium
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true' && matrix.python-version == '3.14'
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -o pythonpath=. examples/realtime/app/test_frontend.py
      - name: Run tests
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true' && matrix.python-version != '3.14'
        run: make tests
      - name: Run async teardown stability tests
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true' && (matrix.python-version == '3.10' || matrix.python-version == '3.14')
        run: make tests-asyncio-stability
      - name: Skip tests
        if: steps.changes.outputs.run != 'true' || steps.look.outputs.run != 'true'
        run: echo "Skipping tests for non-code changes."
      - name: Record tests
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: .github/outrun/run record tests-${{ matrix.python-version }} --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  native-macos-sandbox:
    runs-on: outrun-macos
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: fake-for-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun (outrun)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Look native-macos-sandbox up
        id: look
        run: .github/outrun/run lookup native-macos-sandbox
      - name: Detect code changes
        id: changes
        run: ./.github/scripts/detect-changes.sh code "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" "${{ github.sha }}"
      - name: Setup uv
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # setup-uv v9.0.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: false
          python-version: "3.14"
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: make sync
      - name: Run native macOS sandbox tests
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: uv run pytest -m requires_native_macos_sandbox
      - name: Skip native macOS sandbox tests
        if: steps.changes.outputs.run != 'true' || steps.look.outputs.run != 'true'
        run: echo "Skipping native macOS sandbox tests for non-code changes."
      - name: Record native-macos-sandbox
        if: steps.changes.outputs.run == 'true' && steps.look.outputs.run == 'true'
        run: .github/outrun/run record native-macos-sandbox --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}
